    # Configuration for cargo-deny
# https://embarkstudios.github.io/cargo-deny/

# Note: running just `cargo deny check` is equivalent to `cargo deny check advisories bans licenses sources`

[advisories]
# The path where the advisory database is cloned/fetched into
db-path = "~/.cargo/advisory-db"
# The url(s) of the advisory databases to use
db-urls = ["https://github.com/rustsec/advisory-db"]
# The lint level for crates that have been yanked from their source registry
yanked = "deny"
# A list of advisory IDs to ignore. Note that ignored advisories will still
# output a note when they are encountered.
ignore = []

[licenses]
# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
#
# This project is MIT OR Apache-2.0. Only permissive and compatible licenses
# are allowed for dependencies.
#
# NOTE: To avoid warnings, only actively used licenses are listed below.
# Uncomment additional licenses as you add dependencies that need them.

allow = [
    # Most common in Rust (covers ~90% of crates)
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",

    # BSD family
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",

    # Public domain / highly permissive
    "CC0-1.0",
    "Unlicense",

    # Other common
    "Unicode-3.0",

    # This project's license and GPL-compatible weak-copyleft deps
    "GPL-3.0-or-later",
    "MPL-2.0",
]

# The confidence threshold for detecting a license from license text.
confidence-threshold = 0.8

# Allow 1 or more licenses on a per-crate basis
exceptions = []

# Ignore workspace members for license checks (they're your own code)
private = { ignore = true }

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate version requirement is `*`
wildcards = "warn"
# The graph highlighting used when creating dotgraphs for crates
# with multiple versions
highlight = "all"
# List of crates that are allowed. Use with care!
allow = []
# Kernel-purity bans: these adapter-layer crates must never enter gfcore's
# default (pure) dependency graph. cargo-deny resolves the default feature set,
# which is now empty, so any of these appearing means a non-pure crate leaked
# into the kernel. Keep convenience deps `optional = true` behind features.
#
# NOTE intentionally NOT listed:
#   - `serde_json`: now opt-in (behind `history`/`wasm`) so it is OUT of the pure
#     library tree, but it remains a dev-dependency and cargo-deny includes
#     dev-deps — banning it here would false-positive. Its absence from the
#     shipped kernel is enforced by kernel-purity.yml (`cargo tree --edges normal`).
#   - `serde_norway`: pulled transitively by `cardpack` (an upstream concern).
deny = [
    # Concrete serialization formats (the `serde` trait itself is fine):
    { name = "serde_yaml" },
    { name = "serde_yaml_bw" },
    # Async runtimes:
    { name = "tokio" },
    { name = "async-std" },
    # Transport / RPC / HTTP:
    { name = "reqwest" },
    { name = "hyper" },
    { name = "tonic" },
    { name = "axum" },
    # Storage engines:
    { name = "rusqlite" },
    { name = "sqlx" },
]
# Certain crates/versions that will be skipped when doing duplicate detection.
skip = [
    # getrandom 0.3 (via cardpack/rand) and getrandom 0.4 (via uuid) pull different r-efi versions
    { name = "r-efi" },
    # getrandom 0.3 pulls wasip2 (wit-bindgen 0.46) and uuid pulls wasip3 (wit-bindgen 0.51)
    { name = "wit-bindgen" },
]
# Similarly named crates that are allowed. Similar to `skip` but can use
# glob patterns.
skip-tree = []

[sources]
# Lint level for what to happen when a crate from a crate registry that is not
# in the allow list is encountered
unknown-registry = "warn"
# Lint level for what to happen when a crate from a git repository that is not
# in the allow list is encountered
unknown-git = "warn"
# List of URLs for allowed crate registries. Defaults to the crates.io index
# if not specified. If it is specified but empty, no registries from URLs
# will be allowed.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# List of URLs for allowed Git repositories
allow-git = []

